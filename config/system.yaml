defaults:
  llm:
    temperature: null
    max_tokens: null
    reasoning_effort: null
    context_window_tokens: null
  embedding:
    dimensions: 1024
    batch_size: 32

# 论文检索数据源的可选密钥；没有密钥时填写 null，系统会继续使用匿名检索。
paper_retrieval:
  openalex_api_key: null
  semantic_scholar_api_key: null
  # IEEE Xplore 和 Elsevier 需要各自申请官方 API Key；没有配置时不会被默认全源检索调用。
  ieee_xplore_api_key: null
  elsevier_api_key: null

# read 节点的相关系统配置
read:
  agent_name: default_agent
  # 未在聊天界面单独填写时，默认进入全文深度阅读的论文数量。
  deep_read_limit: 10
  paper_cache_dir: data/paper_cache
  connect_timeout_seconds: 10
  download_timeout_seconds: 60
  max_file_size_mb: 50
  chunk_size: 1024
  chunk_overlap: 150
  vector_store_path: data/vector_store
  vector_store_collection: papers
